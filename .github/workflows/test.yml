name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines" says >=22.18 (the first 22.x that runs .ts files without a flag);
        # keep the oldest supported version in this list.
        node: ['22.18', 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install: the tool and its tests use Node built-ins only.
      - run: npm test
